services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
      POSTGRES_DB: fluxo_crm
    ports:
      - "5432:5432"
    volumes:
      - fluxo_pgdata:/var/lib/postgresql/data

volumes:
  fluxo_pgdata:
